# Sample caller workflow — drop this into any repo to get automated PR
# reviews from up-reviewer.
#
# Setup (one time per repo):
#   1. Add AGENT_API_KEY (or provider-specific key like XIAOMI_API_KEY) as a
#      repository secret (Settings → Secrets → Actions)
#   2. Add this file at .github/workflows/review-pr.yml (or any name you like)
#   3. Push to the default branch — it activates immediately on the next PR
#
# Optional: set AGENT_MODEL in workflow vars to choose the model
# (default: xiaomi/mimo-v2.5). See README.md for all env vars.
#
# How it works:
#   This workflow triggers on PR events, then calls the reusable workflow
#   published in up-reviewer. The reviewer agent fetches the diff via the
#   GitHub API (gh pr diff) and posts inline comments — nothing runs on
#   your code, only the diff text is sent to the model.
#
# Security notes:
#   - The key is stored as a GitHub secret and never leaves the Actions runner.
#   - Only same-repo PRs are reviewed (fork PRs are skipped to avoid running
#     untrusted code with secrets — the reusable workflow enforces this).
#   - The reviewer uses pull_request_target-style isolation (base-branch code
#     only, diff via API) — PR authors cannot steer the agent into exfiltration.

name: PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    uses: binilsn/up-github-agents/.github/workflows/pr-review.yml@main
    secrets:
      AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
    vars:
      AGENT_MODEL: ${{ vars.AGENT_MODEL }}
